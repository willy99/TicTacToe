server:
  port: 8081

spring:
  application:
    name: game-engine-service
  # For the JPA scaffold under infrastructure/persistence/jpa - not used by
  # the actual running app yet, since GameRepository is still the in-memory one.
  datasource:
    url: jdbc:h2:mem:gameengine
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

game-engine:
  board:
    # Board size used when a caller creates a game without specifying one.
    default-size: 3

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.flamingo.tictactoe.engine: INFO
