server:
  port: 8082

spring:
  application:
    name: game-session-service

game-engine:
  base-url: http://localhost:8081

game:
  board:
    # Board size played by automated sessions; forwarded to the Game Engine
    # when a session is created and to the move generation strategy.
    size: 3

simulation:
  # Pause between automated moves so a polling UI can visibly observe the
  # game progressing move by move. Set to 0 to play out instantly.
  move-delay-ms: 500

ui:
  allowed-origin: http://localhost:5173

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.flamingo.tictactoe.session: INFO
